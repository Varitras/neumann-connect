name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so no job gets more than read access.
# Without this the default token permissions apply, which are broader than
# anything this workflow needs.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Integration ist (noch) nicht im home-assistant/brands-Repo
          # registriert - Icons liegen lokal unter brand/.
          ignore: brands

  lint:
    name: Ruff-Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned deliberately: an unpinned Ruff turned the build red on the
      # 0.16.0 release for rules that did not exist when the code was written.
      # Bump this on purpose, not by surprise.
      # --only-binary :all: forbids source distributions, whose build scripts
      # run arbitrary code at install time. Ruff ships wheels everywhere, so
      # this costs nothing here.
      # Quoted: ":all:" contains a colon-space, which YAML would otherwise
      # read as a nested mapping.
      - run: 'pip install --only-binary :all: ruff==0.16.1'
      - run: ruff check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # No --only-binary :all: here, deliberately. Tried and measured: the
      # Home Assistant test tree cannot satisfy it. "mock-open", pulled in by
      # pytest-homeassistant-custom-component, publishes no wheel at all, and
      # Home Assistant pins ciso8601==2.3.2 while only 2.3.3 has one for this
      # Python. Naming those two as exceptions would turn every upstream pin
      # bump into a broken build, and it would buy little: a wheel executes on
      # import just as freely, and the tests import everything.
      - run: pip install -r requirements_test.txt
      # -m "" overrides the default deselection in pytest.ini: CI always runs
      # the end-to-end tests as well. They cost ~50 s, which is irrelevant here
      # and makes every push a full check.
      - run: python -m pytest tests/ -q -m ""

  minimum-ha:
    # The full suite runs against the newest stable Home Assistant. That says
    # nothing about the version hacs.json promises, and the gap is not
    # theoretical: 1.18.0 shipped an import that only exists from 2025.2 while
    # the manifest still claimed 2024.11. Importing every module is enough to
    # catch that class of mistake and costs a fraction of a test run.
    name: Import auf der Mindestversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 2025.2 predates Python 3.14.
          python-version: "3.13"
      # Same reason as the test job above.
      - run: pip install "homeassistant==2025.2.0"
      - name: Import every module of the integration
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          package = pathlib.Path("custom_components/neumann_kh")
          for path in sorted(package.glob("*.py")):
              name = f"custom_components.neumann_kh.{path.stem}"
              importlib.import_module(name)
              print("ok", name)
          PY

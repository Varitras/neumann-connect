name: CI

on:
  push:
    # main only: the merge commit and the release SHA get checked. A
    # feature branch is proven through its pull request instead, so a
    # push there does not run twice.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so no job gets more than read access.
# Without this the default token permissions apply, which are broader than
# anything this workflow needs.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not (yet) registered in the
          # home-assistant/brands repository - icons live locally under brand/.
          ignore: brands

  check:
    # One job for lint, format, tests and the mutation run, because it calls
    # the SAME script a developer runs. A second list of commands here is a
    # second definition of "done", and the two drift silently - tests/test_ci_parity.py
    # fails if this job starts invoking the tools itself again. The cost is
    # that the heavy install happens before the first lint message; check.sh
    # still stops at the first failure, so nothing runs past a broken gate.
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # No --only-binary :all: here, deliberately: tried, and the Home
      # Assistant test tree cannot satisfy it. Several dependencies ship
      # source only - "mock-open" publishes no wheel at all. Which ones they
      # are changes with every upstream pin, so an exception list would turn
      # unrelated bumps into broken builds, and it would buy little anyway:
      # a wheel executes on import just as freely, and the tests import
      # everything.
      #
      # This also installs the pinned tools (via requirements_tools.txt), so
      # their pins live in that file alone. They used to be repeated here,
      # which is one edit away from CI and the developer linting against
      # different releases.
      - run: pip install -r requirements_test.txt
      - run: .github/scripts/check.sh

  check-minimum:
    # The same gates on the version hacs.json promises. Importing every module
    # used to be all this job did; that catches a name that does not exist
    # yet, but not an API whose behaviour or signature differs.
    name: Check on the minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The plugin release that ships exactly the Home Assistant hacs.json
      # declares; naming both makes pip refuse a mismatch, and
      # tests/test_ci_parity.py keeps the version in step with hacs.json.
      # The tools come from requirements_tools.txt, so their pins live there alone.
      # The plugin is named in env, not in the command: test_ci_parity.py
      # refuses tool names in run steps so every gate stays in check.sh.
      - env:
          PHCC_SPEC: "pytest-homeassistant-custom-component==0.13.371"
        run: pip install "$PHCC_SPEC" "homeassistant==2026.10.0" -r requirements_tools.txt
      - name: The job must run the version hacs.json declares
        run: |
          python - <<'PY'
          import json
          from homeassistant.const import __version__
          declared = json.load(open("hacs.json"))["homeassistant"]
          assert __version__ == declared, f"running {__version__}, hacs.json declares {declared}"
          print("Home Assistant", __version__)
          PY
      - run: .github/scripts/check.sh

  check-latest:
    # The same gates on the newest FINAL Home Assistant. The pinned plugin in
    # requirements_test.txt is raised by hand, and between two raises users
    # already run newer releases - removed or deprecated APIs show up here
    # first. resolve_phcc.py skips plugin releases that pin a beta.
    name: Check on the latest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Resolve the plugin version to install
        run: python .github/scripts/resolve_phcc.py latest-stable-ha | tee -a "$GITHUB_ENV"
      - run: pip install "$PHCC_SPEC" -r requirements_tools.txt
      - run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - run: .github/scripts/check.sh

  secret-scan:
    # The pre-push hook scans locally; this is its portable twin for every
    # clone, over the whole history. check.sh fails while the pin below is
    # behind the latest release (check_gitleaks_pin.py), because Dependabot
    # only follows `uses:` lines.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full history
        # Redacted, so a finding never prints the secret into a public log.
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .

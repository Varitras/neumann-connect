name: CI

on:
  push:
    # Every branch, so a feature branch is proven before it reaches main.
    # Dependabot's own branches are excluded here and covered by the
    # pull_request trigger instead, which spares them a double run.
    # Never a second `branches-ignore` alongside this: GitHub rejects the
    # whole file and nothing runs at all, with no red cross to notice.
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so no job gets more than read access.
# Without this the default token permissions apply, which are broader than
# anything this workflow needs.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Integration ist (noch) nicht im home-assistant/brands-Repo
          # registriert - Icons liegen lokal unter brand/.
          ignore: brands

  check:
    # One job for lint, format, tests and the mutation run, because it calls
    # the SAME script a developer runs. A second list of commands here is a
    # second definition of "done", and the two drift silently - tests/test_ci_parity.py
    # fails if this job starts invoking the tools itself again. The cost is
    # that the heavy install happens before the first lint message; check.sh
    # still stops at the first failure, so nothing runs past a broken gate.
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # No --only-binary :all: here, deliberately: tried, and the Home
      # Assistant test tree cannot satisfy it. Several dependencies ship
      # source only - "mock-open" publishes no wheel at all. Which ones they
      # are changes with every upstream pin, so an exception list would turn
      # unrelated bumps into broken builds, and it would buy little anyway:
      # a wheel executes on import just as freely, and the tests import
      # everything.
      #
      # This also installs the pinned Ruff, so the pin lives in that file
      # alone. It used to be repeated here, which is one edit away from CI
      # and the developer linting against different releases.
      - run: pip install -r requirements_test.txt
      - run: .github/scripts/check.sh

  minimum-ha:
    # The full suite runs against the newest stable Home Assistant. That says
    # nothing about the version hacs.json promises, and the gap is not
    # theoretical: 1.18.0 shipped an import that only exists from 2025.2 while
    # the manifest still claimed 2024.11. Importing every module is enough to
    # catch that class of mistake and costs a fraction of a test run.
    name: Import auf der Mindestversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 2025.2 predates Python 3.14.
          python-version: "3.13"
      # Same reason as the test job above.
      - run: pip install "homeassistant==2025.2.0"
      - name: Import every module of the integration
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          package = pathlib.Path("custom_components/neumann_kh")
          for path in sorted(package.glob("*.py")):
              name = f"custom_components.neumann_kh.{path.stem}"
              importlib.import_module(name)
              print("ok", name)
          PY

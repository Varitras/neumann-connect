[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Safety net against hanging tests (locally and in CI).
timeout = 30
# e2e tests are the slow ones - a full Home Assistant boot per test, or a
# nested pytest run in the mutation-harness checks - and are deselected by
# default so the everyday run stays short. They are mandatory before a
# release and run automatically in CI.
#   everyday : pytest tests/ -q
#   e2e only : pytest tests/ -q -m e2e
#   full run : pytest tests/ -q -m ""
addopts = -m "not e2e"
markers =
    e2e: slow test - full Home Assistant boot or nested pytest run
